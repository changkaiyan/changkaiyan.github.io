name: Update Publication Citation Counts

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Save current publications.yml hash
        id: before
        run: |
          if [ -f _data/publications.yml ]; then
            sha_before=$(sha256sum _data/publications.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          set +e
          start_time=$(date)
          timeout 180 python bin/update_publication_citations.py
          status=$?
          end_time=$(date)
          if [ $status -eq 0 ]; then
            echo "Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "Citation update script failed with exit code $status (started at $start_time, ended at $end_time)."
            echo "Citation update script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
          fi
          set -e

      - name: Save new publications.yml hash
        id: after
        run: |
          if [ -f _data/publications.yml ]; then
            sha_after=$(sha256sum _data/publications.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
          fi

      - name: Report publications.yml change in summary
        run: |
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "_data/publications.yml was updated."
            echo "_data/publications.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "_data/publications.yml was not changed."
            echo "_data/publications.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _data/publications.yml
          git diff --staged --quiet || (
            git commit -m "Update publication citation counts"
            git push
          )
